    总结一下这个学期吧，这个学期算上 CSP 打了六场比赛
    - ICPC 深圳邀请赛（打铁）
    - ICPC 南昌邀请赛（打铁）
    - ICPC/CCPC 重庆省赛（银牌）
    - CQUT 程序设计大赛（第二）
    - 天梯赛
    - 第42次 CSP 认证

    总的来说，这个学期参加的比赛较多，但是拿奖不多（感谢重庆省赛让我在期末拿了块牌子） \
    暑假得加训了，希望下半年区域赛不会打铁
